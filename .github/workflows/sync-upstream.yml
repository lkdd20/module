name: Sync upstream modules and all JS files

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Sync modules and complete JS repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream-module https://github.com/IBL3ND/module.git
          git fetch upstream-module main
          git merge --no-edit -X theirs upstream-module/main
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          git clone --depth 1 --branch main https://github.com/IBL3ND/js.git "$tmpdir/upstream-js"
          mkdir -p js
          rsync -a --delete --exclude='.git/' "$tmpdir/upstream-js/" js/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Egern-YouTube.yaml")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "https://raw.githubusercontent.com/IBL3ND/js/refs/heads/main/",
              "https://raw.githubusercontent.com/lkdd20/module/main/js/"
          ).replace(
              "https://raw.githubusercontent.com/IBL3ND/js/main/",
              "https://raw.githubusercontent.com/lkdd20/module/main/js/"
          )
          p.write_text(text, encoding="utf-8")
          PY
          git add -A js Egern-YouTube.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: mirror all upstream JS files and localize module URLs"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi
